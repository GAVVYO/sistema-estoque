services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stock_v2}
      MYSQL_USER: ${MYSQL_USER:-stock_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina uma senha local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina a senha root local}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
