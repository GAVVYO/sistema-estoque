name: gavyo-lavanderia-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: lavanderia_demo
    volumes:
      - demo_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d lavanderia_demo']
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    init: true
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/lavanderia_demo
      API_PROXY_TARGET: http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  demo_database:
